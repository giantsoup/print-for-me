# Managed by print-for-me .github/scripts/windows (setup-production.ps1 / deploy.ps1).
# Do not edit here: edit the template in the repo and deploy. Herd does not manage this file.
server {
    listen 127.0.0.1:8030;
    server_name {{TAILNET_HOST}} 127.0.0.1 localhost;
    root "{{PUBLIC_ROOT}}";
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    if ($host !~* "^({{TAILNET_HOST_REGEX}}|127\.0\.0\.1|localhost)$") { return 421; }

    access_log off;
    error_log "{{HERD_LOG}}/print-for-me-production-nginx-error.log";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { log_not_found off; }
    location = /robots.txt  { log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9085;
        fastcgi_param SCRIPT_FILENAME   $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT     $realpath_root;
        fastcgi_param QUERY_STRING      $query_string;
        fastcgi_param REQUEST_METHOD    $request_method;
        fastcgi_param CONTENT_TYPE      $content_type;
        fastcgi_param CONTENT_LENGTH    $content_length;
        fastcgi_param SCRIPT_NAME       $fastcgi_script_name;
        fastcgi_param REQUEST_URI       $request_uri;
        fastcgi_param DOCUMENT_URI      $document_uri;
        fastcgi_param SERVER_PROTOCOL   $server_protocol;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE   nginx;
        fastcgi_param REMOTE_ADDR       $remote_addr;
        fastcgi_param REMOTE_PORT       $remote_port;
        fastcgi_param SERVER_ADDR       $server_addr;
        fastcgi_param SERVER_PORT       $server_port;
        fastcgi_param SERVER_NAME       $server_name;
        fastcgi_param REDIRECT_STATUS   200;
        fastcgi_param HTTP_PROXY        "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        fastcgi_buffer_size 512k;
        fastcgi_buffers 16 512k;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ { return 404; }
}
